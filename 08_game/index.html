<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>몽글몽글 가위바위보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fff1f6; --bg2:#eef4ff;
    --ink:#5b4a6b; --soft:#9a8aa8;
    --pink:#ff8fb1; --pink-d:#f06292; --mint:#7fd8be; --sky:#8ec5ff; --lemon:#ffe08a;
    --card:#ffffffcc; --shadow:0 8px 0 #00000010, 0 14px 30px #c9a7d633;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Jua","Malgun Gothic",system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 12% 18%, #ffd6e5 0 60px, transparent 61px),
      radial-gradient(circle at 88% 12%, #d7e8ff 0 80px, transparent 81px),
      radial-gradient(circle at 80% 88%, #ffeec2 0 70px, transparent 71px),
      radial-gradient(circle at 8% 85%, #d6f5ea 0 55px, transparent 56px),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh; display:flex; justify-content:center; overflow-x:hidden;
  }
  main{width:100%; max-width:720px; padding:20px 16px 32px; display:flex; flex-direction:column; gap:16px}
  header{text-align:center}
  h1{margin:4px 0 0; font-size:clamp(28px,7vw,42px); font-weight:400; letter-spacing:1px;
     color:var(--pink-d); text-shadow:3px 3px 0 #fff, 5px 5px 0 #ffd0df}
  .sub{margin:4px 0 0; color:var(--soft); font-size:15px}

  .score{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .pill{background:var(--card); border-radius:20px; padding:10px 8px; text-align:center; box-shadow:var(--shadow); border:3px solid #fff}
  .pill .k{font-size:14px; color:var(--soft)} .pill .v{font-size:30px; line-height:1.1}
  .pill.me .v{color:var(--pink-d)} .pill.draw .v{color:#b49a3a} .pill.cpu .v{color:#5b8fd6}

  .arena{position:relative; background:var(--card); border:4px solid #fff; border-radius:32px; box-shadow:var(--shadow);
         padding:18px 12px 14px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:6px}
  .side{display:flex; flex-direction:column; align-items:center; gap:6px}
  .name{font-size:18px; background:#fff; padding:3px 14px; border-radius:99px; box-shadow:0 3px 0 #00000010}
  .name.me{color:var(--pink-d)} .name.cpu{color:#5b8fd6}
  .stage{width:min(36vw,190px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center;
         background:radial-gradient(circle at 50% 40%, #fff 0 55%, #ffe3ee 56%)}
  .stage.cpu{background:radial-gradient(circle at 50% 40%, #fff 0 55%, #e0ecff 56%)}
  .stage svg{width:82%; height:82%; overflow:visible}
  .vs{font-size:28px; color:#c7b6d6}
  .shake svg{animation:bob .35s ease-in-out infinite alternate}
  .pop svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  .win svg{animation:jump .6s ease-in-out infinite}
  .lose svg{animation:wobble 1s ease-in-out infinite; filter:saturate(.7)}
  @keyframes bob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
  @keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
  @keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

  .banner{grid-column:1/-1; text-align:center; min-height:46px; margin-top:4px; font-size:clamp(22px,5.5vw,30px)}
  .banner span{display:inline-block; padding:4px 22px; border-radius:99px}
  .banner .win{background:#ffe0ec; color:var(--pink-d); animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  .banner .lose{background:#e3eeff; color:#4a7cc4; animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  .banner .draw{background:#fff3c9; color:#a5871f; animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  .banner .call{color:var(--soft); animation:pop .3s ease}
  .streak{grid-column:1/-1; text-align:center; font-size:15px; color:var(--soft); min-height:20px}

  .pick-title{text-align:center; font-size:18px; color:var(--soft); margin:2px 0 -6px}
  .choices{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  .choice{appearance:none; border:4px solid #fff; background:var(--card); border-radius:28px; padding:10px 6px 8px; cursor:pointer;
          font:inherit; color:var(--ink); box-shadow:0 7px 0 #e8cfe0, 0 12px 24px #c9a7d633; transition:transform .12s, box-shadow .12s}
  .choice svg{width:min(22vw,110px); height:auto; display:block; margin:0 auto; overflow:visible}
  .choice .lbl{font-size:20px} .choice kbd{font:inherit; font-size:12px; color:var(--soft); margin-left:4px}
  .choice:hover{transform:translateY(-4px) rotate(-2deg)}
  .choice:active{transform:translateY(4px); box-shadow:0 2px 0 #e8cfe0}
  .choice:disabled{opacity:.55; cursor:default; transform:none}
  .choice[data-c=rock]:hover{background:#f1efff} .choice[data-c=scissors]:hover{background:#ffeef4} .choice[data-c=paper]:hover{background:#fffbe8}

  .history{display:flex; justify-content:center; gap:6px; flex-wrap:wrap; min-height:22px}
  .dot{width:18px; height:18px; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 0 #00000012; animation:pop .3s ease}
  .dot.win{background:var(--pink)} .dot.lose{background:var(--sky)} .dot.draw{background:var(--lemon)}

  .tools{display:flex; justify-content:center; gap:10px}
  .tools button{font:inherit; font-size:15px; color:var(--soft); background:#fff; border:none; border-radius:99px; padding:7px 16px;
                cursor:pointer; box-shadow:0 3px 0 #00000012}
  .tools button:hover{color:var(--pink-d)}

  .confetti{position:fixed; top:-20px; width:12px; height:12px; border-radius:3px; pointer-events:none; z-index:10;
            animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  @media (max-width:420px){ .arena{padding:14px 6px 10px} .vs{font-size:20px} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<main>
  <header>
    <h1>몽글몽글 가위바위보</h1>
    <p class="sub">몽글이를 이겨보세요! (키보드 1·2·3 도 돼요)</p>
  </header>

  <section class="score" aria-label="점수">
    <div class="pill me"><div class="k">나</div><div class="v" id="sMe">0</div></div>
    <div class="pill draw"><div class="k">비김</div><div class="v" id="sDraw">0</div></div>
    <div class="pill cpu"><div class="k">몽글이</div><div class="v" id="sCpu">0</div></div>
  </section>

  <section class="arena">
    <div class="side"><div class="name me">나</div><div class="stage me" id="stMe"></div></div>
    <div class="vs">VS</div>
    <div class="side"><div class="name cpu">몽글이</div><div class="stage cpu" id="stCpu"></div></div>
    <div class="banner" id="banner" aria-live="polite"><span class="call">아래에서 하나 골라요!</span></div>
    <div class="streak" id="streak"></div>
  </section>

  <p class="pick-title">무엇을 낼까요?</p>
  <section class="choices" id="choices">
    <button class="choice" data-c="scissors"><span class="art"></span><span class="lbl">가위</span><kbd>1</kbd></button>
    <button class="choice" data-c="rock"><span class="art"></span><span class="lbl">바위</span><kbd>2</kbd></button>
    <button class="choice" data-c="paper"><span class="art"></span><span class="lbl">보</span><kbd>3</kbd></button>
  </section>

  <div class="history" id="history" aria-label="최근 결과"></div>
  <div class="tools">
    <button id="btnSound">🔊 소리 켜짐</button>
    <button id="btnReset">↺ 처음부터</button>
  </div>
</main>

<script>
const NAMES = {rock:'바위', paper:'보', scissors:'가위'};
const BEATS = {rock:'scissors', paper:'rock', scissors:'paper'};
const INK = '#5b4a6b';

/* ---------- 귀여운 얼굴 ---------- */
function face(cx, cy, expr){
  const blush = `<ellipse cx="${cx-14}" cy="${cy+6}" rx="5" ry="3" fill="#ff9ab8" opacity=".7"/>
                 <ellipse cx="${cx+14}" cy="${cy+6}" rx="5" ry="3" fill="#ff9ab8" opacity=".7"/>`;
  const dotEyes = `<circle cx="${cx-8}" cy="${cy-2}" r="3.4" fill="${INK}"/><circle cx="${cx+8}" cy="${cy-2}" r="3.4" fill="${INK}"/>
                   <circle cx="${cx-7}" cy="${cy-3.2}" r="1.1" fill="#fff"/><circle cx="${cx+9}" cy="${cy-3.2}" r="1.1" fill="#fff"/>`;
  let eyes = dotEyes, mouth = '', extra = '';
  if (expr === 'happy'){
    eyes = `<path d="M${cx-11} ${cy-1} Q${cx-8} ${cy-6} ${cx-5} ${cy-1}" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M${cx+5} ${cy-1} Q${cx+8} ${cy-6} ${cx+11} ${cy-1}" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    mouth = `<path d="M${cx-5} ${cy+4} Q${cx} ${cy+13} ${cx+5} ${cy+4} Z" fill="${INK}"/><path d="M${cx-2.5} ${cy+8.5} Q${cx} ${cy+11} ${cx+2.5} ${cy+8.5}" fill="#ff7f9f"/>`;
  } else if (expr === 'sad'){
    mouth = `<path d="M${cx-4} ${cy+9} Q${cx} ${cy+4} ${cx+4} ${cy+9}" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    extra = `<path d="M${cx+11} ${cy+1} q-2.5 4 0 6 q2.5 -2 0 -6Z" fill="#7cc4ff"/>`;
  } else if (expr === 'think'){
    mouth = `<circle cx="${cx}" cy="${cy+7}" r="2.6" fill="${INK}"/>`;
  } else {
    mouth = `<path d="M${cx-4} ${cy+5} Q${cx} ${cy+9} ${cx+4} ${cy+5}" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  }
  return blush + eyes + mouth + extra;
}

/* ---------- 캐릭터 ---------- */
function charSVG(type, expr='normal'){
  let body = '';
  if (type === 'rock'){
    body = `<path d="M18 62 C12 40 30 20 50 20 C73 20 90 37 85 60 C82 79 67 88 50 88 C31 88 21 79 18 62Z" fill="#c4bde8" stroke="#a79fd3" stroke-width="3"/>
            <ellipse cx="36" cy="36" rx="9" ry="5" fill="#fff" opacity=".55" transform="rotate(-25 36 36)"/>
            <circle cx="72" cy="72" r="3" fill="#a79fd3" opacity=".6"/><circle cx="28" cy="70" r="2" fill="#a79fd3" opacity=".6"/>
            ${face(52,56,expr)}`;
  } else if (type === 'paper'){
    body = `<path d="M22 14 H66 L80 28 V82 Q80 88 74 88 H26 Q20 88 20 82 V20 Q20 14 26 14Z" fill="#fffaf0" stroke="#f0d3a6" stroke-width="3"/>
            <path d="M66 14 V24 Q66 28 70 28 H80" fill="#ffe9c4" stroke="#f0d3a6" stroke-width="3" stroke-linejoin="round"/>
            <path d="M30 30 H56 M30 76 H70" stroke="#f6e2bf" stroke-width="3" stroke-linecap="round"/>
            ${face(50,55,expr)}`;
  } else if (type === 'scissors'){
    body = `<rect x="44" y="0" width="12" height="52" rx="6" fill="#d9ecfb" stroke="#a9cdee" stroke-width="3" transform="rotate(-22 50 52)"/>
            <rect x="44" y="0" width="12" height="52" rx="6" fill="#d9ecfb" stroke="#a9cdee" stroke-width="3" transform="rotate(22 50 52)"/>
            <circle cx="33" cy="82" r="11" fill="none" stroke="#ff9ec0" stroke-width="7"/>
            <circle cx="67" cy="82" r="11" fill="none" stroke="#ff9ec0" stroke-width="7"/>
            <circle cx="50" cy="56" r="21" fill="#ffc6da" stroke="#ff9ec0" stroke-width="3"/>
            ${face(50,56,expr)}`;
  } else {
    body = `<path d="M18 60 C14 36 32 18 50 18 C70 18 88 34 84 58 C80 80 66 88 50 88 C32 88 22 80 18 60Z" fill="#cfe2ff" stroke="#a6c6f5" stroke-width="3"/>
            <path d="M30 22 L24 6 L40 16Z M70 22 L76 6 L60 16Z" fill="#cfe2ff" stroke="#a6c6f5" stroke-width="3" stroke-linejoin="round"/>
            ${face(50,54,expr)}
            <text x="78" y="22" font-size="22" fill="#a6c6f5" font-family="Jua">?</text>`;
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${body}</svg>`;
}

/* ---------- 소리 ---------- */
let soundOn = true, actx = null;
function beep(freq, dur=.12, type='sine', delay=0, vol=.15){
  if (!soundOn) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  }catch(e){}
}
const sfx = {
  tick: () => beep(660, .08, 'triangle'),
  win:  () => [523,659,784,1047].forEach((f,i)=>beep(f,.16,'triangle',i*.09)),
  lose: () => [392,330,262].forEach((f,i)=>beep(f,.2,'sine',i*.12)),
  draw: () => [523,523].forEach((f,i)=>beep(f,.1,'square',i*.14,.06)),
};

/* ---------- 상태 ---------- */
const $ = id => document.getElementById(id);
let score = {me:0, draw:0, cpu:0}, streak = 0, history = [], busy = false;
try{ const s = JSON.parse(localStorage.getItem('mongle-rps')); if (s && s.score) { score = s.score; streak = s.streak||0; history = s.history||[]; } }catch(e){}
function save(){ try{ localStorage.setItem('mongle-rps', JSON.stringify({score, streak, history})); }catch(e){} }

function setStage(el, type, expr, anim){
  el.className = el.className.replace(/\b(shake|pop|win|lose)\b/g,'').trim();
  el.innerHTML = charSVG(type, expr);
  if (anim) { void el.offsetWidth; el.classList.add(anim); }
}
function render(){
  $('sMe').textContent = score.me; $('sDraw').textContent = score.draw; $('sCpu').textContent = score.cpu;
  $('history').innerHTML = history.slice(-12).map(r => `<span class="dot ${r}" title="${{win:'이김',lose:'짐',draw:'비김'}[r]}"></span>`).join('');
  $('streak').textContent = streak >= 2 ? `🔥 ${streak}연승 중!` : '';
}
function banner(cls, text){ $('banner').innerHTML = `<span class="${cls}">${text}</span>`; }

function confetti(){
  const colors = ['#ff8fb1','#7fd8be','#8ec5ff','#ffe08a','#c4bde8'];
  for (let i=0;i<40;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.4 + Math.random()*1.4) + 's';
    c.style.animationDelay = (Math.random()*.3) + 's';
    if (Math.random() < .4) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3200);
  }
}

/* ---------- 게임 ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
async function play(me){
  if (busy) return;
  busy = true;
  document.querySelectorAll('.choice').forEach(b => b.disabled = true);
  const stMe = $('stMe'), stCpu = $('stCpu');
  setStage(stMe, 'rock', 'think', 'shake');
  setStage(stCpu, 'mystery', 'think', 'shake');
  for (const word of ['가위!', '바위!', '보!']) { banner('call', word); sfx.tick(); await wait(380); }

  const cpu = ['rock','paper','scissors'][Math.floor(Math.random()*3)];
  const result = me === cpu ? 'draw' : (BEATS[me] === cpu ? 'win' : 'lose');
  const exprMe  = result === 'win' ? 'happy' : result === 'lose' ? 'sad' : 'normal';
  const exprCpu = result === 'lose' ? 'happy' : result === 'win' ? 'sad' : 'normal';
  setStage(stMe, me, exprMe, 'pop');
  setStage(stCpu, cpu, exprCpu, 'pop');
  await wait(450);
  stMe.classList.add(result === 'win' ? 'win' : result === 'lose' ? 'lose' : 'pop');
  stCpu.classList.add(result === 'lose' ? 'win' : result === 'win' ? 'lose' : 'pop');

  if (result === 'win'){ score.me++; streak++; banner('win', `이겼다! ${NAMES[me]} > ${NAMES[cpu]} 🎉`); sfx.win(); confetti(); }
  else if (result === 'lose'){ score.cpu++; streak = 0; banner('lose', `졌어요… ${NAMES[me]} < ${NAMES[cpu]} 😢`); sfx.lose(); }
  else { score.draw++; banner('draw', `비겼어요! 둘 다 ${NAMES[me]} 🤝`); sfx.draw(); }
  history.push(result); if (history.length > 50) history.shift();
  render(); save();

  document.querySelectorAll('.choice').forEach(b => b.disabled = false);
  busy = false;
}

document.querySelectorAll('.choice').forEach(b => {
  b.querySelector('.art').innerHTML = charSVG(b.dataset.c, 'normal');
  b.addEventListener('click', () => play(b.dataset.c));
});
document.addEventListener('keydown', e => {
  const k = {'1':'scissors','2':'rock','3':'paper'}[e.key];
  if (k) play(k);
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn;
  $('btnSound').textContent = soundOn ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
});
$('btnReset').addEventListener('click', () => {
  if (busy) return;
  score = {me:0, draw:0, cpu:0}; streak = 0; history = [];
  save(); render(); banner('call', '아래에서 하나 골라요!');
  setStage($('stMe'), 'rock', 'normal'); setStage($('stCpu'), 'mystery', 'normal');
});

setStage($('stMe'), 'rock', 'normal');
setStage($('stCpu'), 'mystery', 'normal');
render();
</script>
</body>
</html>
